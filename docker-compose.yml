services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1-deno
    init: true
    mem_limit: 384m
    restart: unless-stopped
    expose:
      - "4416"

  # 统一 TypeScript 服务端（单一对外 8787 端口，进程内直连 Worker）
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    init: true
    depends_on:
      - pot-provider
    ports:
      # 仅绑定宿主机回环地址；如需局域网访问，请改为 "${PORT:-8787}:8787" 并自行加访问控制
      - "127.0.0.1:${PORT:-8787}:8787"
    volumes:
      - server-data:/app/cache
      # Optional Netscape-format YouTube cookies can be placed here.
      - ./cookies:/run/secrets:ro
    environment:
      - HOST=0.0.0.0
      - PORT=8787
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - CACHE_DIR=/app/cache
      - TRANSLATION_AGENT_STORAGE=/app/cache/worker-storage.db
      - CACHE_METADATA_TTL_SECONDS=${CACHE_METADATA_TTL_SECONDS:-86400}
      - CACHE_JSON3_TTL_SECONDS=${CACHE_JSON3_TTL_SECONDS:-2592000}
      - CACHE_CUES_TTL_SECONDS=${CACHE_CUES_TTL_SECONDS:-0}
      - CACHE_TRANSLATION_TTL_SECONDS=${CACHE_TRANSLATION_TTL_SECONDS:-0}
      - CACHE_WHISPER_TTL_SECONDS=${CACHE_WHISPER_TTL_SECONDS:-0}
      - CACHE_MAX_BYTES=${CACHE_MAX_BYTES:-5368709120}
      - CACHE_MAINTENANCE_INTERVAL_SECONDS=${CACHE_MAINTENANCE_INTERVAL_SECONDS:-86400}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - TRANSLATE_API_KEY=${TRANSLATE_API_KEY:-}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - TRANSLATION_AGENT_MODEL=${TRANSLATION_AGENT_MODEL:-gpt-4o}
      - TRANSLATION_REASONING_EFFORT=${TRANSLATION_REASONING_EFFORT:-off}
      - TRANSLATION_MAIN_REASONING_EFFORT=${TRANSLATION_MAIN_REASONING_EFFORT:-}
      - TRANSLATION_SUBAGENT_REASONING_EFFORT=${TRANSLATION_SUBAGENT_REASONING_EFFORT:-}
      - WHISPER_API_KEY=${WHISPER_API_KEY:-}
      - WHISPER_BASE_URL=${WHISPER_BASE_URL:-}
      - WHISPER_MODEL=${WHISPER_MODEL:-whisper-large-v3}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - TRANSLATION_CONTEXT_TOKENS=${TRANSLATION_CONTEXT_TOKENS:-128000}
      - TRANSLATION_OUTPUT_TOKENS=${TRANSLATION_OUTPUT_TOKENS:-16384}
      - TRANSLATION_REQUEST_BUDGET=${TRANSLATION_REQUEST_BUDGET:-0}
      - YTDLP_POT_PROVIDER_URL=http://pot-provider:4416
      - YTDLP_YOUTUBE_CLIENT=android,mweb
      # Optional Netscape-format cookies file on the host. Set YTDLP_COOKIES_FILE
      # in .env and mount that file if YouTube challenges the server IP.
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 历史兼容实现：独立 Worker（单体统一服务已内置 Worker，保留此服务作为备选）
  worker:
    profiles:
      - legacy
    build:
      context: .
      dockerfile: Dockerfile.worker
    init: true
    volumes:
      - worker-data:/app/cache
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - TRANSLATE_API_KEY=${TRANSLATE_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - TRANSLATION_AGENT_MODEL=${TRANSLATION_AGENT_MODEL:-gpt-4o}
      - TRANSLATION_REASONING_EFFORT=${TRANSLATION_REASONING_EFFORT:-off}
      - TRANSLATION_MAIN_REASONING_EFFORT=${TRANSLATION_MAIN_REASONING_EFFORT:-}
      - TRANSLATION_SUBAGENT_REASONING_EFFORT=${TRANSLATION_SUBAGENT_REASONING_EFFORT:-}
      - TRANSLATION_CONTEXT_TOKENS=${TRANSLATION_CONTEXT_TOKENS:-128000}
      - TRANSLATION_OUTPUT_TOKENS=${TRANSLATION_OUTPUT_TOKENS:-16384}
      - TRANSLATION_REQUEST_BUDGET=${TRANSLATION_REQUEST_BUDGET:-0}
    restart: unless-stopped
    expose:
      - "8788"

volumes:
  server-data:
  worker-data:
