[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-ingest"
version = "0.2.0"
description = "YouTube subtitle & translation backend service for kiss-translator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "yt-dlp",
  "fastapi>=0.112,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx-ws>=0.6,<1",
]

[project.scripts]
youtube-ingest = "youtube_ingest.cli:main"
youtube-ingest-server = "youtube_ingest.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_ingest"]
